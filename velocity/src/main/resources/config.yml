# CivDiscord — Velocity plugin config
discord:
  token: REPLACE_ME              # Discord bot token. Use ${VAR} to read an env var, or set CIVDISCORD_DISCORD_TOKEN.
  home_guild_id: 0               # ID of the bot's "home" Discord guild — gets admin commands

database:
  path: civdiscord.db            # SQLite file inside plugins/civdiscord/

# NameLayer permission checks read this MariaDB directly from Velocity so
# /relay bind and snitch toggles work even when the backend has no players
# connected (plugin messages can't ferry without a carrier).
# Point this at the same DB your Paper backend's NameLayer plugin uses.
namelayer_db:
  host: REPLACE_ME
  port: 3306
  user: REPLACE_ME
  password: REPLACE_ME           # Use ${VAR} or set CIVDISCORD_NAMELAYER_DB_PASSWORD.
  database: REPLACE_ME

# Bridge plugin-message security between Velocity and each Paper backend.
# When hmac_enabled: true, every bridge frame is HMAC-SHA256 signed using
# plugins/civdiscord/secret.key. Velocity auto-generates this file on first start —
# copy it to plugins/civdiscord/secret.key on every Paper backend before they connect.
# Default on; turning it off lets any connected player impersonate the proxy and run
# arbitrary commands as the server console.
bridge:
  hmac_enabled: true

# Discord→MC chat limits. Each linked Discord user gets a token bucket; messages
# over max_length are truncated, control chars are stripped, and over-rate
# messages are dropped silently (no oracle for attackers probing the limit).
chat:
  max_length: 256                 # vanilla MC chat cap
  burst: 5                        # bucket capacity per linked user
  refill_per_second: 1.0          # tokens added per second

# Optional. Omit the entire block to skip Patreon sync.
# patreon:
#   access_token: REPLACE_ME     # Use ${VAR} for env-var substitution, or set CIVDISCORD_PATREON_TOKEN.
#   campaign_id: REPLACE_ME
#   tier_roles:
#     gold: 0                    # Discord role id granted to "gold" tier patrons
#     silver: 0
#   sync_interval_minutes: 60
#   refresh_token: REPLACE_ME    # Optional OAuth refresh creds — used if access_token returns 401.
#   client_id: REPLACE_ME
#   client_secret: REPLACE_ME

# Live server stats shown in Discord (presence, an embed dashboard, optional voice/topic labels).
# Bind surfaces with /stats in the home guild. Set enabled: false to turn the whole feature off.
stats:
  enabled: true
  max_players: 150          # shown as X/max; 0 hides the denominator
  fast_seconds: 60          # presence + embed refresh
  slow_minutes: 10          # voice/topic refresh (Discord's floor is 10)
  metrics_stale_seconds: 90 # TPS older than this renders as a dash
